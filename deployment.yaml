apiVersion:apps/v1
kind: Deployment
metadata:
  name:my-deployment
  labels:
    app:deploy
spec:
  replicas:2
  selector:
    matchLabels:
      app:deploy
  strategy:
    type:RollingUpdate
    rollingUpdate:
      maxSurge:1
      maxUnavailable:1
  template:
    metadata:
      Labels:
      app:deploy
    spec:
      containers:
      - name:nginx-cont
        image:nginx:latest
        ports:
        - containerPort:80
---
apiVersion: v1
kind: service
metadata:
  name: deploy-svc
  labels:
    app:deploy
type: NodePort
selector:
  app:deploy
ports:
  - port:80
    targetPort:80
    nodePort:30001